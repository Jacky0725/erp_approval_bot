config_schema_version: 2
app:
  name: reagent-approval-bot
  dry_run: false
browser:
  headless: true
  slow_mo_ms: 0
  timeout_ms: 30000
llm:
  provider: siliconflow
  base_url: https://api.siliconflow.cn/v1
  model: deepseek-ai/DeepSeek-V3.2
  timeout_seconds: 30
  max_retries: 0
chemical_search:
  # A checksum-valid ERP CAS resolved by PubChem is the formal identity.  Any
  # mismatch with the supplied name is retained as an audit record only.
  cas_authoritative: true
  query_priority:
  - cleaned_name
  - standard_name
  - english_name
  - aliases
  - cas_verification
  max_name_queries: 3
  providers:
  - pubchem
  - chemsrc
  - chemicalbook
  - nist
  requests_per_second: 2
  per_source_concurrency: 1
  max_attempts: 2
  request_timeout_seconds: 8
  read_timeout_seconds: 8
  lookup_budget_seconds: 20
  batch_budget_seconds: 120
  batch_workers: 3
  provider_budget_seconds:
    chemsrc: 6
    chemicalbook: 3
    pubchem: 6
    nist: 4
  provider_negative_cache_seconds: 60
  pubchem_batch_prefetch: true
  failure_circuit_break_threshold: 3
  failure_circuit_cooldown_seconds: 300
  stale_if_error_days: 180
  chemsrc_enabled: true
  chemicalbook_enabled: true
  pubchem_enabled: true
  nist_enabled: true
  property_enrichment:
    enabled: true
    max_requests: 3
    budget_seconds: 8
    providers:
    - pubchem
    - chemsrc
    - chemicalbook
    - nist
    fields:
    - flash_point
    - boiling_point
    - toxicity
    - ghs_classification
    - corrosive
    - oxidizing
    - flammable
    - water_reactive
    - explosive_risk
    - heavy_metal
  enable_fallback_web_research: false
  fallback_timeout_seconds: 8
  fallback_max_queries: 4
  fallback_research_budget_seconds: 35
  cache:
    enabled: true
    path: data/chemical_search_cache.sqlite
    success_ttl_days: 30
    failure_ttl_days: 1
    failure_ttl_minutes: 30
erp_api:
  protocol: odoo_jsonrpc
  base_url: https://xxpt.sh-tianhan.com:5500
  enabled_for_write: true
  web_verify_after_api_write: true
  verify_attempts: 3
  verify_delays_seconds:
  - 0.5
  - 1
  - 2
  discovery:
    enabled: true
    mode: capture_normal_approval_write
    required_write_samples: 2
    min_confidence: 0.9
    status: verified
    candidate_path: data/logs/erp_api_candidate.yaml
    backup_dir: data/logs/erp_api_config_backups
    canary_on_next_run: false
    last_result: ''
    updated_at: '2026-09-15T09:02:01'
    previous_config:
      protocol: odoo_jsonrpc
      base_url: ''
      enabled_for_write: false
      web_verify_after_api_write: true
      verify_attempts: 3
      verify_delays_seconds:
      - 0.5
      - 1
      - 2
      endpoints:
        todo_tasks: ''
        reagent_detail: /api/dataset/cors_call_kw
        save_property: /api/dataset/cors_call_kw
        verify_property: /api/dataset/cors_call_kw
      rpc:
        endpoint: /api/dataset/cors_call_kw
        models:
          list_model: reagent.list
          line_model: reagent.list.line
          property_model: reagent.phchproperty
        line_fields:
        - id
        - name
        - cas_code
        - box_num
        - spec
        - spec_unit_id
        - type
        - product_uom_qty
        - phchproperty_id
        - phchproperty_name
        - sequence
        - reagent_list_id
        line_write_fields:
        - id
        - name
        - cas_code
        - box_num
        - spec
        - spec_unit_id
        - type
        - desc
        - phchproperty_id
        - refer_single_price
        - approval_desc
        - is_danger
        - reagent_list_id
        - price_approval_desc
        - price_state
        - phchproperty_name
        - sequence
      pagination:
        list_number_param: listNumber
        page_param: pageNum
        page_size_param: pageSize
        page_size: 200
        max_pages: 50
      record_id_fields:
      - id
      - recordId
      - detailId
      - reagentId
      property_fields:
      - 物化特性
      - physicochemicalProperty
      - property
      field_mapping:
        清单号:
        - listNumber
        - approvalNo
        序号:
        - sequence
        - seq
        - index
        试剂名称:
        - reagentName
        - name
        CAS号:
        - cas
        - casNo
        - cas_code
        规格单位:
        - unit
        - specUnit
        试剂数量:
        - quantity
        - amount
        物化特性:
        - physicochemicalProperty
        - property
        - phchproperty_name
        record_id:
        - id
        - recordId
      save_payload_mapping:
        record_id: id
        property: physicochemicalProperty
        list_number: listNumber
        sequence: sequence
        name: reagentName
        cas: cas
      success_indicators:
      - field: success
        value: true
      - field: ok
        value: true
      - field: code
        value: 0
    confidence: 1.0
  endpoints:
    reagent_detail: /api/dataset/cors_call_kw
    save_property: /api/dataset/cors_call_kw
    verify_property: /api/dataset/cors_call_kw
  rpc:
    endpoint: /api/dataset/cors_call_kw
    models:
      list_model: reagent.list
      line_model: reagent.list.line
      property_model: reagent.phchproperty
  pagination:
    list_number_param: listNumber
    page_param: pageNum
    page_size_param: pageSize
    page_size: 200
    max_pages: 50
  record_id_fields:
  - id
  property_fields:
  - phchproperty_id
  - phchproperty_name
  field_mapping:
    清单号:
    - listNumber
    - approvalNo
    序号:
    - sequence
    试剂名称:
    - name
    CAS号:
    - cas
    - casNo
    - cas_code
    规格单位:
    - unit
    - specUnit
    试剂数量:
    - quantity
    - amount
    物化特性:
    - phchproperty_name
    - phchproperty_id
    record_id:
    - id
  save_payload_mapping:
    record_id: params.args.1.reagent_list_line_ids.0.1
    property: params.args.1.reagent_list_line_ids.0.2.phchproperty_id
    name: params.args.1.reagent_list_line_ids.0.2.name
  success_indicators:
  - field: result
    value: true
  save_method: POST
  save_content_type: application/json
  reagent_detail_method: POST
  save_static_payload: {}
memory_sync:
  enabled: false
  provider: webdav
  base_url: https://dav.jianguoyun.com/dav/
  remote_dir: reagent-approval-bot
  username_env: JIANGUOYUN_WEBDAV_USER
  password_env: JIANGUOYUN_WEBDAV_PASSWORD
  keep_versions: 10
  auto_upload_after_memory_change: true
  check_remote_on_startup: true
paths:
  rules_excel: config/rules.xlsx
  structured_rules_excel: config/rules_structured.xlsx
  rule_candidates_excel: config/rule_candidates.xlsx
  name_aliases_yaml: config/name_aliases.yaml
  review_queue_excel: data/review_queue.xlsx
  audit_log_dir: data/logs
approval:
  pipeline_version: v3
  identity_enrichment:
    enabled: false
    provider: aliyun_bailian
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model: qwen3.7-flash
    timeout_seconds: 10
    max_calls_per_batch: 20
    max_calls_per_day: 200
  v3:
    base_url: https://ws-n7pzljbon73jfgip.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model: qwen3.7-plus
    retrieval_mode: model_first
    batch_size: 5
    parallel_batches: 2
    timeout_seconds: 45
    max_retries: 1
    cost_warning_cny: 10.0
    address_mode: workspace_beijing
    workspace_id: ws-n7pzljbon73jfgip
    custom_base_url: ''
  default_action: manual_review
  enable_llm_manual_review_advice: true
  llm_manual_review_advice_mode: batch
  identity_conflict_policy:
    mode: cas_authoritative_audit_only
    require_manual_confirmation: false
    promote_confirmed_correction_to_memory: false
    auto_update_erp_cas: false
  llm_identity_review:
    enabled: true
    trigger_on_cas_missing: true
    trigger_on_name_cas_conflict: true
    allow_model_knowledge: true
    advisory_only: true
    max_calls_per_identity: 1
  write_mode: multi_page
  erp_write_backend: api_write_with_web_verify
  write_min_confidence: 0.7
  write_batch_size: 5
  write_max_attempts: 2
  write_failure_break_limit: 1
  parallel_workers: 3
  reagent_page_size: 20
  allowed_actions:
  - approve
  - reject
  - manual_review
scheduler:
  enabled: false
  mode: daily
  interval_hours: 6
  daily_time: '16:00'
  use_default_run_policy: true
  process_all_todos_max: 50
  approval_write_mode: multi_page
  approval_write_min_confidence: '0.7'
  auto_pass: false
  skip_manual_review_lists: true
notification:
  dingtalk:
    enabled: true
    at_all: true
enrichment_v2:
  enabled: false
  shadow_mode: true
  providers:
    pubchem:
      read_timeout_seconds: 10
      max_concurrency: 2
      include_hazard_details: true
    nist:
      enabled: true
      read_timeout_seconds: 8
    comptox:
      enabled: false
      api_key_env: EPA_CTX_API_KEY
  llm:
    enabled: false
  chinese_alias_backfill:
    enabled: false
    sources:
    - chemsrc
    - chemicalbook
    auto_promote: false
enrichment_metrics:
  enabled: true
  jsonl_path: data/logs/enrichment_metrics.jsonl
dingtalk_stream:
  enabled: true
  corp_id: ''
  agent_id: ''
  robot_code: ''
  open_conversation_id: ''
  client_id_env: DINGTALK_STREAM_CLIENT_ID
  client_secret_env: DINGTALK_STREAM_CLIENT_SECRET
  api_token_env: DINGTALK_STREAM_API_TOKEN
  require_at_in_group: true
reagent:
  physicochemical_property_options:
  - 普通类
  - 重金属类
  - 溴碘类
  - 常规酸
  - 常规碱
  - 特殊酸
  - 异味
  - 发烟类
  - 高毒类
  - 氧化剂
  - 强反应
  - 刺激性
  - 易燃类
  - 易爆类
  - 拒收类
  - 未知类
  physicochemical_property_aliases:
    强反应性:
    - 强反应
    易燃液体:
    - 易燃类
    不建议接收类:
    - 拒收类
    拒收类:
    - 拒收类
    未知类:
    - 未知类
selectors:
  username_input: '#userName'
  password_input: '#password'
  login_button: button[type='submit']
  review_items: ''
  approve_button: ''
  reject_button: ''
